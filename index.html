<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logros Steam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:rgba(255,255,255,.055);--b:rgba(255,255,255,.11);--t:#e8edf5;--m:#8b95a7;--c:#22d3ee;--gr:#34d399;--au:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 8% -10%,#0b3a4a66,transparent),radial-gradient(800px 500px at 100% 0,#3a0b4a44,transparent),radial-gradient(700px 500px at 50% 110%,#0b4a3a44,transparent),#000;background-attachment:fixed}
h1,h2,.num,.nm{font-family:"Chakra Petch","Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.gl{background:var(--g);border:1px solid var(--b);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:28px}h1 span{color:var(--c);text-shadow:0 0 18px var(--c)}
.sub{color:var(--m);font-size:13px}
h2{font-size:18px;margin:26px 0 10px}
button,select,input{font:inherit;color:inherit}
button{background:var(--g);border:1px solid var(--b);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--c);box-shadow:0 0 12px #22d3ee44}
button.on{border-color:var(--c);background:#22d3ee22}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{padding:14px 16px}.num{font-size:30px;font-weight:700}.lb{color:var(--m);font-size:13px}
.q{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.slot{padding:12px;min-height:130px;display:flex;gap:12px;align-items:center}
.slot.empty{border-style:dashed;color:var(--m);justify-content:center;text-align:center}
.slot img{width:130px;border-radius:10px}.slot .rk{font:700 26px "Chakra Petch";color:var(--au)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;padding:12px;align-items:center}
.ctl input[type=search]{flex:1 1 200px;background:#0006;border:1px solid var(--b);border-radius:10px;padding:8px 12px}
select{background:#111;border:1px solid var(--b);border-radius:10px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;align-items:start}
.card{overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0009,0 0 0 1px #22d3ee55}
.card.done{border-color:#fbbf2488;box-shadow:0 0 22px #fbbf2422}
.card.flash{animation:fl 1.2s 2}
@keyframes fl{50%{box-shadow:0 0 30px var(--c)}}
.head{cursor:pointer}
.head img{display:block;width:100%;aspect-ratio:460/215;object-fit:cover;background:#111}
.in{padding:12px 14px}
.nm{font-weight:700;font-size:17px;margin-bottom:6px}
.bar{height:8px;border-radius:9px;background:#ffffff14;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),var(--gr));box-shadow:0 0 10px var(--c);transition:width .8s}
.done .bar i{background:linear-gradient(90deg,#f59e0b,#fde68a,#f59e0b);background-size:200%;box-shadow:0 0 12px var(--au);animation:sh 2.5s linear infinite}
@keyframes sh{to{background-position:200%}}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--m);font-size:13px}
.bd{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:6px 4px 0 0;border:1px solid var(--b)}
.bd.au{color:var(--au);border-color:#fbbf2466}.bd.ul{color:#f472b6;border-color:#f472b666}
.act{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.act a{color:var(--t);text-decoration:none;background:var(--g);border:1px solid var(--b);border-radius:10px;padding:7px 12px}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.open .acc{grid-template-rows:1fr}.acc>div{overflow:hidden}
.al{padding:0 14px}.sw{display:flex;gap:6px;align-items:center;color:var(--m);font-size:13px;padding:6px 14px}
.ach{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--b);font-size:13px}
.ach.no{opacity:.72}.ach>b{color:var(--gr)}.ach.no>b{color:var(--m)}
.ach small{color:var(--m)}.ach .r{margin-left:auto;text-align:right;white-space:nowrap}
.rad{padding:10px}.rad svg{display:block;margin:0 auto;max-width:420px;width:100%}
.gh{grid-column:1/-1;margin:14px 0 0;font:700 17px "Chakra Petch",sans-serif}
.ico{width:34px;height:34px;border-radius:6px;flex:none}.ach.no .ico{opacity:.8}
.note{padding:8px 14px 4px;font-size:13px;color:var(--m)}.note b{color:var(--t)}
.bd.rd{color:#f87171;border-color:#f8717166}.bd.ok{color:var(--gr);border-color:#34d39966}
#bg{position:fixed;inset:-20px;z-index:-1;background-position:center top;background-size:cover;filter:blur(7px) saturate(1.2);opacity:0;transition:opacity 1.4s}#bg.on{opacity:.32}
.mdl{position:fixed;inset:0;z-index:20;background:#000a;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s}
.mdl[hidden]{display:none}
#mc{width:min(720px,100%);max-height:88vh;overflow:auto;padding:16px;background:rgba(14,18,26,.94);animation:pop .25s}
@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
#mc>.x,#rc>.x{position:sticky;top:0;float:right;z-index:2;background:#000c;margin:0 0 6px 8px}
.mh{display:flex;gap:14px;align-items:flex-start}.mh img{width:210px;max-width:38%;border-radius:10px}.mh>div{flex:1;min-width:0}
#mc .al{padding:0}#mc .sw{padding:10px 0 4px}#mc .note{padding:10px 0 0}
@media(max-width:520px){.mh{flex-direction:column}.mh img{max-width:100%;width:100%}}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center;transition:opacity .45s,transform .45s,filter .45s}
#home[hidden]{display:none}#home.leave{opacity:0;transform:scale(1.05);filter:blur(10px);pointer-events:none}
#home h1{font-size:clamp(28px,5vw,46px);margin:0}#home p{margin:0}
#opts{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.acct{--ac:#39ff88;width:260px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;border-radius:22px;animation:rise .7s both;transition:transform .3s,box-shadow .3s,border-color .3s}
.acct:nth-child(2){--ac:#ff4fd8;animation-delay:.12s}
.acct:hover{transform:translateY(-8px) scale(1.02);border-color:var(--ac);box-shadow:0 18px 50px #000a,0 0 34px color-mix(in srgb,var(--ac) 40%,transparent)}
.acct img,.ini{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);box-shadow:0 0 24px color-mix(in srgb,var(--ac) 50%,transparent)}
.ini{display:grid;place-items:center;font:700 44px "Chakra Petch",sans-serif;background:#ffffff0d;color:var(--ac)}
.acct .nm{font-size:22px;margin:0}.acct small{color:var(--m)}
#app.in{animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(6px)}}
.u-cioccolatuu{color:#39ff88;text-shadow:0 0 12px #39ff8899;font-weight:700}
.u-habukyy{color:#ff4fd8;text-shadow:0 0 12px #ff4fd899;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
#stats.flip{animation:flip .55s}@keyframes flip{from{transform:perspective(800px) rotateX(-90deg);opacity:0}}
.cp{grid-column:1/-1;display:flex;gap:22px;align-items:center;padding:18px;flex-wrap:wrap}
.ring{width:140px;height:140px;flex:none}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.hr{margin:12px 0}.hr>b{display:block;font-size:13px;color:var(--m);margin-bottom:4px}
.pb{height:22px;background:#ffffff0f;border-radius:8px;margin:3px 0;position:relative;overflow:hidden}.pb i{display:block;height:100%;border-radius:8px}
.pb em{position:absolute;left:8px;top:1px;font-style:normal;font-size:13px;color:#fff;text-shadow:0 0 4px #000}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}@media(max-width:520px){.cc{grid-template-columns:1fr}}
.wh{position:relative;width:min(400px,86vw);aspect-ratio:1;margin:10px auto}#wh{width:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}
.pn{position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:9px solid transparent;border-top:16px solid var(--au);border-bottom:0}
#sp{position:fixed;left:12px;bottom:18px;z-index:8;width:min(300px,calc(100% - 24px));padding:6px;transition:transform .35s}#sp.min{transform:translateX(-120%)}#sp[hidden]{display:none}
#fab{position:fixed;right:14px;bottom:18px;z-index:7;display:flex;flex-direction:column;gap:10px}#fab[hidden]{display:none}
#fab button{width:52px;height:52px;border-radius:50%;font-size:22px;padding:0;background:rgba(14,18,26,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#rs{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000b;padding:16px;animation:fi .2s}#rs[hidden]{display:none}
#rc{width:min(420px,100%);padding:18px;text-align:center;background:rgba(14,18,26,.96);animation:pop .3s}#rc img{width:100%;border-radius:12px;margin:10px 0}
#ph{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .8s}#ph.on{opacity:1}
#ph .col{position:absolute;top:0;bottom:0;width:clamp(110px,12vw,190px);display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
#ph .l{left:10px}#ph .r{right:10px}
#ph figure{margin:0;width:min(100%,17vh);aspect-ratio:1;transform:rotate(var(--r));border:5px solid #ffffffe0;border-bottom-width:16px;border-radius:4px;background:#111;box-shadow:0 8px 22px #000b,0 0 20px #ff4fd844;display:grid;place-items:center;font-size:28px;animation:rise .8s both}
#ph img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s}
@media(max-width:900px){#ph.on{opacity:.28}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 18px;opacity:0;pointer-events:none;transition:.3s;z-index:5;background:#000c}
#toast.s{opacity:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ph"></div>
<canvas id="cf"></canvas>
<section id="home">
  <div><h1>¿De quién quieres ver la cuenta?</h1><p class="sub">Elige un perfil para abrir su dashboard de logros</p></div>
  <div id="opts"></div>
</section>
<main id="app" hidden>
<header>
  <div><h1>Logros de <span id="who"></span></h1><div class="sub" id="upd">Cargando…</div></div>
  <div><button data-a="home">↩ Cambiar cuenta</button> <button data-a="bg" id="bgb"></button> <button data-a="snd" id="snd"></button></div>
</header>

<p class="row"><button data-a="cm" id="cm">💞 Compatibilidad</button><button data-a="h2h">⚔️ Cara a cara</button></p>
<section class="stats" id="stats"></section>

<h2>Maestría por género</h2>
<section class="rad gl" id="radar"></section>

<h2>Próximos platinos</h2>
<section class="q" id="queue"></section>
<p><button data-a="exp">Copiar widget para README</button></p>

<div id="lib">
<h2>Biblioteca</h2>
<section class="ctl gl">
  <input type="search" id="q" placeholder="Buscar juego…" aria-label="Buscar juego">
  <select id="sort" aria-label="Ordenar">
    <option value="plat">Platinados primero</option>
    <option value="nplat">No platinados primero</option>
    <option value="az">Nombre A–Z</option>
    <option value="za">Nombre Z–A</option>
  </select>
  <button data-a="near" id="near">Cerca del platino (80%+)</button>
  <button data-a="df" data-v="easy" id="df-easy">Fáciles</button>
  <button data-a="df" data-v="hard" id="df-hard">Hardcore</button>
  <button data-a="md" data-v="solo" id="md-solo">Solo jugador</button>
  <button data-a="md" data-v="multi" id="md-multi">Multijugador</button>
  <button data-a="grp" id="grp">Agrupar por saga</button>
  <button data-a="com" id="com">👫 Multijugador en común</button>
  <button data-a="rnd">🎲 Aleatorio</button>
</section>
<p class="sub" id="count"></p>
<section class="grid" id="grid"></section>
</div>
</main>
<div id="fab" hidden><button data-a="rl" title="¿Qué jugamos hoy?" aria-label="Ruleta">🎰</button><button data-a="sp" title="Playlist" aria-label="Playlist">🎵</button></div>
<div id="sp" class="gl min" hidden><div class="spf"></div></div>
<div id="rs" hidden role="dialog" aria-modal="true" aria-label="Resultado de la ruleta"><div id="rc" class="gl"></div></div>
<div id="md" class="mdl" hidden role="dialog" aria-modal="true" aria-label="Detalle del juego"><div id="mc" class="gl"></div></div>
<div id="toast" class="gl"></div>

<script>
// ===== CONFIG: tu Gist (siempre la última versión) =====
const GIST="https://gist.githubusercontent.com/Cioccolatuu/5a48a8fdfd3590ee577e81916d0f0c7a/raw/";
const CUENTAS=[{id:"cioccolatuu",nombre:"cioccolatuu"},{id:"habukyy",nombre:"habukyy"}];
const SPOTIFY="https://open.spotify.com/playlist/2QpUvxEgR1xYpS8PL244FU";   // enlace normal de la playlist (el de "Compartir")
const REPO="Cioccolatuu/steam-logros";
const FOTOS=["fotos/IMG_7500.jpg","fotos/IMG_7501.jpg","fotos/IMG_7502.jpg","fotos/IMG_7503.jpg","fotos/IMG_7504.jpg","fotos/IMG_7505.jpg","fotos/IMG_7506.jpg","fotos/IMG_7507.jpg","fotos/IMG_7509.jpg","fotos/IMG_7510.jpg","fotos/IMG_7511.jpg","fotos/IMG_7512.jpg","fotos/IMG_7513.jpg","fotos/IMG_7514.jpg","fotos/IMG_7515.jpg","fotos/IMG_7516.jpg","fotos/IMG_7517.jpg","fotos/IMG_7518.jpg","fotos/IMG_7519.jpg","fotos/IMG_7520.jpg"];     // respaldo: normalmente las fotos de la carpeta "fotos" se detectan solas
const COL={cioccolatuu:"#39ff88",habukyy:"#ff4fd8"};
const U=id=>`<span class="u-${id}">${id}</span>`;
const OT=()=>S.cuenta==="cioccolatuu"?"habukyy":"cioccolatuu";

// ===== Utilidades =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const cmp=(a,b)=>a.juego.localeCompare(b.juego,"es");
const fd=d=>d.toLocaleDateString("es-CL");
const cover=id=>`https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`;

// ===== Estado =====
const S={games:[],q:"",sort:"plat",near:false,diff:"",mode:"",grp:false,bgm:ls.get("bgm","neutro"),queue:[],sound:ls.get("sound",true),open:new Set(),pf:{}};

// ===== Datos de ejemplo (si el Gist no responde) =====
const mk=(a,n,h,u,p,x={})=>({appid:a,juego:n,horas_jugadas:h,logros_total:u+p,logros_desbloqueados:u,completado_pct:Math.round(u/(u+p)*1000)/10,
 desbloqueados:Array.from({length:u},(_,i)=>({nombre:"Logro "+(i+1),descripcion:"Descripción de ejemplo",fecha:`2026-0${1+i%9}-1${i%9} 20:00`,rareza_global_pct:+(60/(i+1)+1).toFixed(1)})),
 pendientes:Array.from({length:p},(_,i)=>({nombre:"Pendiente "+(i+1),descripcion:"Cómo obtenerlo (ejemplo)",oculto:false,rareza_global_pct:+(3+i).toFixed(1)})),...x});
const DEMO={actualizado:"datos de ejemplo",juegos:[
 mk(1245620,"ELDEN RING",120,30,12,{store:{generos:["RPG","Acción","Aventura"],solo:true,multi:true,dlc:1},meta:{saga:"FromSoftware",nota:10,comentario:"Obra maestra.",logro_molesto:"Pendiente 3",horas_hltb:135,perdibles_pendientes:2}}),
 mk(367520,"Hollow Knight",60,63,0,{store:{generos:["Acción","Aventura","Indie"],solo:true,multi:false,dlc:4},meta:{nota:9}}),
 mk(1145360,"Hades",45,40,8,{store:{generos:["Acción","Indie","RPG"],solo:true,multi:false,dlc:0},meta:{horas_hltb:50}})]};

// ===== Cálculos por juego =====
function prep(g){
  const all=g.desbloqueados.concat(g.pendientes).filter(x=>x.rareza_global_pct>0);
  const avg=all.length?all.reduce((s,x)=>s+(100-x.rareza_global_pct),0)/all.length:50;
  g.dif=Math.min(10,Math.max(1,+(avg/10).toFixed(1)));          // 1–10 según rareza global
  g.plat=g.completado_pct>=100;
  g.lph=g.horas_jugadas>0?(g.logros_desbloqueados/g.horas_jugadas).toFixed(2):"—";
  g.meta=g.meta||{};g.store=g.store||{};const hb=g.meta.horas_hltb;
  if(hb&&g.completado_pct>0&&!g.plat){const r=g.horas_jugadas/(hb*g.completado_pct/100);g.pace=r<=1?["Ritmo excelente","ok"]:r<=1.3?["En meta","au"]:["Grind pendiente","rd"]}
  const ds=g.desbloqueados.map(x=>x.fecha&&new Date(x.fecha.replace(" ","T"))).filter(Boolean);
  if(g.plat&&ds.length){g.last=new Date(Math.max(...ds));g.first=new Date(Math.min(...ds));g.span=Math.round((g.last-g.first)/864e5)}
  return g;
}

// ===== Sonido y confeti =====
const SFX={tick:["square",[880],.06,.04],open:["triangle",[440,660,880],.06,.07],close:["triangle",[660,440],.06,.07],add:["square",[523,784],.08,.05],remove:["square",[392,262],.08,.05],error:["sawtooth",[180,140],.12,.05],dice:["square",[600,800,500,900,700,1000],.05,.04],copy:["triangle",[988,1319],.08,.07],sweep:["sine",[300,500,700,900],.05,.08],win:["square",[523,659,784,1047,1319],.1,.05]};
let AC;function sfx(n){if(!S.sound||!SFX[n])return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 const[ty,fr,st,vo]=SFX[n];fr.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*st;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(vo,t);g.gain.exponentialRampToValueAtTime(.001,t+st*1.8);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+st*2)})}catch{}}
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*15,vy:-2-Math.random()*12,s:4+Math.random()*5,r:Math.random()*6,k:["#fbbf24","#fde68a","#f59e0b","#fff"][Math.random()*4|0]}));
 let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.k;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
 if(++n<160)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function celebrate(){confetti();sfx("win")}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("s"),2800)}

// ===== Render =====
function visible(){
  let l=S.games.filter(g=>g.juego.toLowerCase().includes(S.q.toLowerCase()));
  if(S.near)l=l.filter(g=>g.completado_pct>=80&&!g.plat);
  if(S.diff==="easy")l=l.filter(g=>g.dif<=4.5);
  if(S.diff==="hard")l=l.filter(g=>g.dif>=6);
  if(S.mode==="solo")l=l.filter(g=>g.store.solo&&!g.store.multi);
  if(S.mode==="multi")l=l.filter(g=>g.store.multi);
  if(S.com){const c=new Set(commonIds());l=l.filter(g=>c.has(g.appid))}
  const rest=f=>l.filter(f).sort(cmp);
  if(S.sort==="plat")return rest(g=>g.plat).concat(rest(g=>!g.plat));

function spin(){
  const b=$("#spinb"),n=(S.wheel||[]).length;if(!b||n<2||b.disabled)return;b.disabled=true;
  const w=Math.random()*n|0,target=360-(w+.5)*(360/n);rot+=360*5+((target-rot%360)+360)%360;
  $("#wh").style.transform=`rotate(${rot}deg)`;sfx("dice");
  setTimeout(()=>{const bb=$("#spinb");if(bb)bb.disabled=false;if($("#wh"))showR(S.wheel[w])},4300)}
function showR(g){
  $("#rc").innerHTML=`<button class="x" data-a="cr" aria-label="Cerrar">✕</button><div class="sub">¡Hoy toca!</div><img src="${cover(g.appid)}" alt="" onerror="this.style.display='none'"><div class="nm">🎮 ${esc(g.juego)}</div><p style="margin-top:14px"><button data-a="again">🔁 Girar de nuevo</button> <button data-a="cr">Cerrar</button></p>`;
  $("#rs").hidden=false;celebrate()}
function closeR(){$("#rs").hidden=true}
const spUrl=()=>SPOTIFY.replace(/^(https?:\/\/open\.spotify\.com\/)(?!embed)/,"$1embed/").split("?")[0];
let SPT=[],SPQ=[],SPL=false,SPOK=false,SPLAST={pos:0,dur:0};
const spNext=()=>{if(!SPQ.length)SPQ=SPT.slice().sort(()=>Math.random()-.5);return"spotify:track:"+SPQ.pop()};   // aleatorio sin repetir hasta agotar la lista
function spPlain(f){f.innerHTML=`<iframe title="Spotify" src="${esc(spUrl())}" width="100%" height="80" allow="encrypted-media" loading="lazy" style="border:0;border-radius:12px"></iframe>`}
async function spToggle(){
  const sp=$("#sp");sp.classList.toggle("min");const f=sp.querySelector(".spf");if(f.dataset.b)return;f.dataset.b="1";   // nada suena hasta que lo activas
  if(!SPOTIFY){f.innerHTML=`<p class="sub" style="margin:8px">Aún no hay una playlist configurada.</p>`;return}
  try{const r=await fetch(GIST+"playlist.json?t="+Date.now());if(r.ok)SPT=(await r.json()).tracks||[]}catch{}
  if(SPT.length<2)return spPlain(f);   // sin lista de canciones: reproductor normal de la playlist
  f.innerHTML=`<div id="spe"></div>`;
  window.onSpotifyIframeApiReady=A=>A.createController($("#spe"),{uri:spNext(),width:"100%",height:80},c=>{SPOK=true;
    c.addListener("ready",()=>c.play());
    c.addListener("playback_update",e=>{const d=e.data||{};
      if(!d.isPaused){SPLAST={pos:d.position,dur:d.duration};return}
      if(!SPL&&SPLAST.dur>0&&SPLAST.dur-SPLAST.pos<3000){SPL=true;SPLAST={pos:0,dur:0};c.loadUri(spNext());setTimeout(()=>{c.play();SPL=false},1500)}})});   // al terminar una canción, sigue otra al azar
  const sc=document.createElement("script");sc.src="https://open.spotify.com/embed/iframe-api/v1";sc.async=true;sc.onerror=()=>spPlain(f);document.body.appendChild(sc);
  setTimeout(()=>{if(!SPOK)spPlain(f)},6000)}
let PH=null;
async function loadPhotos(){
  if(PH)return PH;let l=[];
  if(!l.length){try{const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/fotos");if(r.ok)l=(await r.json()).filter(f=>/\.(jpe?g|png|webp|gif)$/i.test(f.name)).map(f=>"fotos/"+encodeURIComponent(f.name))}catch{}}
  if(!l.length)l=FOTOS.slice();return PH=l}
async function phShow(on){
  const el=$("#ph");el.classList.toggle("on",on);if(!on||el.dataset.b)return;el.dataset.b="1";
  const l=(await loadPhotos()).slice().sort(()=>Math.random()-.5),N=10,items=Array.from({length:N},(_,i)=>l.length?l[i%l.length]:"");
  el.innerHTML=["l","r"].map((sd,k)=>`<div class="col ${sd}">${items.filter((_,i)=>i%2===k).map((u,i)=>`<figure style="--r:${(i*7+k*4)%13-6}deg">${u?`<img src="${esc(u)}" alt="" loading="lazy">`:`<span>💗</span>`}</figure>`).join("")}</div>`).join("");
  if(!l.length)toast("Sube tus fotos a la carpeta «fotos» del repositorio");
  else if(l.length>N)setInterval(()=>{const im=[...el.querySelectorAll("img")];if(!el.classList.contains("on")||!im.length)return;const x=im[Math.random()*im.length|0];x.style.opacity=0;setTimeout(()=>{x.src=l[Math.random()*l.length|0];x.style.opacity=1},650)},9000)}

// ===== Pantalla de inicio, cuentas y carga =====
async function landing(){
  let R={};try{const r=await fetch(GIST+"cuentas.json?t="+Date.now());if(r.ok)R=await r.json()}catch{}
  $("#opts").innerHTML=CUENTAS.map(c=>{const x=R[c.id]||{};
   return`<button class="acct gl" data-a="pick" data-id="${c.id}">${x.avatar?`<img src="${esc(x.avatar)}" alt="">`:`<span class="ini">${esc(c.nombre[0].toUpperCase())}</span>`}
   <h2 class="nm u-${c.id}">${esc(c.nombre)}</h2><small>${x.juegos!=null?`${x.juegos} juegos · ${x.platinados} platinos · ${(x.logros||0).toLocaleString("es-CL")} logros`:"Ver logros"}</small></button>`}).join("");
}
function pick(id){
  const c=CUENTAS.find(x=>x.id===id);if(!c)return;sfx("open");
  const h=$("#home");h.classList.add("leave");
  setTimeout(()=>{h.hidden=true;const a=$("#app");a.hidden=false;a.classList.remove("in");void a.offsetWidth;a.classList.add("in");scrollTo(0,0);cargar(c)},450);
}
function home(){
  closeM();sfx("close");S.cuenta=null;$("#fab").hidden=true;$("#sp").hidden=true;$("#rs").hidden=true;phShow(false);S.bg=0;$("#bg").classList.remove("on");
  $("#app").hidden=true;$("#app").classList.remove("in");
  const h=$("#home");h.hidden=false;void h.offsetWidth;h.classList.remove("leave");scrollTo(0,0);
}
async function cargar(c){
  Object.assign(S,{cuenta:c.id,com:false,compat:false,other:null,q:"",sort:"plat",near:false,diff:"",mode:"",grp:false,pf:{},bg:0,rnd:null,games:[]});
  $("#q").value="";$("#sort").value="plat";$("#cm").classList.remove("on");$("#who").className="u-"+c.id;$("#who").textContent=c.nombre;document.title="Logros de "+c.nombre;
  ["#stats","#radar","#queue","#grid","#count"].forEach(q=>$(q).innerHTML="");$("#upd").textContent="Cargando…";
  S.queue=ls.get("queue_"+c.id,c.id==="cioccolatuu"?ls.get("queue",[]):[]);
  let d;try{const r=await fetch(GIST+`logros_${c.id}.json?t=`+Date.now());if(!r.ok)throw 0;d=await r.json()}catch{d=DEMO;setTimeout(()=>toast("No pude leer los datos de "+c.nombre+": muestro datos de ejemplo"),500)}
  if(S.cuenta!==c.id)return;   // cambiaste de cuenta mientras cargaba
  S.games=d.juegos.map(prep);
  const done=S.queue.filter(id=>S.games.some(g=>g.appid===id&&g.plat));   // auto-desmarcado al 100%
  S.queue=S.queue.filter(id=>S.games.some(g=>g.appid===id&&!g.plat));saveQ();
  $("#upd").textContent="Actualizado: "+(d.actualizado||"—").replace("T"," ");
  renderAll();cargarOtro(c);$("#fab").hidden=false;$("#sp").hidden=false;
  if(done.length){celebrate();toast("🏆 Platino detectado: sale de la cola")}
}
landing();
</script>
